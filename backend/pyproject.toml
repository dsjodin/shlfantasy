[project]
name = "shlfantasy"
version = "0.1.0"
description = "Hjälpverktyg för Fantasy SHL: byteskalkylator, optimerare och AI-rådgivare"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pulp>=4.0",
    "highspy>=1.7",
    "numpy>=1.26",
    "anthropic>=1.15,<2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
